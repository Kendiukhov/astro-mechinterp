[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astron-mi"
version = "1.0.0"
description = "Mechanistic interpretability tooling for the AION-1 astronomical foundation model"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "h5py>=3.10",
    "pyarrow>=15",
    "astropy>=6",
    "polymathic-aion==0.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["astron_mi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
